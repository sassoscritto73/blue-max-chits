<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b73">
  <title>Blue Max Damage Chit Draw</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f4f7; color: #17202a; }
    main { max-width: 680px; margin: 0 auto; padding: 20px 16px 32px; }
    h1 { margin: 0 0 18px; font-size: 28px; }
    h2 { font-size: 19px; margin: 25px 0 10px; }
    .panel { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px #00000012; }
    label { display: block; font-weight: 700; }
    select, input { display: block; width: 100%; margin-top: 7px; padding: 12px; font: inherit; font-size: 18px; border: 1px solid #c9d0d8; border-radius: 10px; background: white; color: #17202a; }
    .damage-selectors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .damage-selector { min-width: 0; }
    .damage-label { display: block; margin-bottom: 7px; font-weight: 800; }
    .damage-control { display: grid; grid-template-columns: minmax(58px, 1fr) clamp(48px, 11vw, 58px) clamp(48px, 11vw, 58px); gap: 8px; align-items: stretch; }
    .damage-value { min-width: 0; min-height: 52px; height: 52px; margin: 0; padding: 8px; text-align: center; font-size: 18px; }
    button { border: 0; border-radius: 11px; font: inherit; font-size: 17px; font-weight: 800; color: white; cursor: pointer; touch-action: manipulation; }
    button:active { transform: scale(.99); }
    .step-button { display: flex; align-items: center; justify-content: center; width: auto; min-width: 0; min-height: 52px; height: 52px; margin: 0; padding: 0 0 2px; border-radius: 10px; font-size: 34px; line-height: 1; }
    .step-button.red { background: #ed1c2e; }
    .step-button.blue { background: #1769aa; }
    .actions { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px; margin-top: 16px; }
    .actions button { display: flex; align-items: center; justify-content: center; min-height: 54px; height: 54px; margin: 0; padding: 10px 12px; text-align: center; line-height: 1; }
    .draw-button { background: #20b653; }
    .reset-button { background: #59636e; }
    .status { margin-top: 12px; color: #4d5965; text-align: center; min-height: 22px; }
    .warning { color: #8b1e1e; background: #fff0f0; border-radius: 10px; padding: 10px; margin-top: 12px; text-align: center; }
    .groups { display: grid; gap: 16px; }
    .group { display: grid; gap: 8px; }
    .group-title { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #58636f; }
    .result { width: 100%; appearance: none; -webkit-appearance: none; display: block; margin: 0; border: 0; outline: 0; border-radius: 11px; padding: 0; color: white; font: inherit; line-height: normal; text-align: left; cursor: pointer; overflow: hidden; box-shadow: 0 1px 5px #0000001c; transition: transform 170ms ease, filter 170ms ease; touch-action: manipulation; }
    .result:active { transform: scale(.985); }
    .result.blue { background: linear-gradient(135deg, #1769aa, #0d3f76); }
    .result.red { background: linear-gradient(135deg, #bd2525, #791313); }
    .result-content { display: flex; flex-direction: column; min-height: 120px; padding: 11px 13px 12px; }
    .result.hidden .header-line, .result.hidden .value { display: none; }
    .cover { display: none; margin: auto 0; font-size: 16px; font-weight: 900; letter-spacing: .12em; opacity: .95; text-align: center; }
    .result.hidden .cover { display: block; }
    .header-line { display: flex; justify-content: space-between; align-items: baseline; min-height: 15px; }
    .side { font-size: 12px; line-height: 1.1; letter-spacing: .08em; font-weight: 800; opacity: .85; }
    .id { font-size: 12px; line-height: 1.1; opacity: .85; }
    .value { display: block; margin-top: 14px; font-size: 22px; font-weight: 900; line-height: 1.15; }
    .empty { color: #68737e; text-align: center; padding: 24px 8px; }
    .flip { animation: flip-in 340ms ease-out both; }
    @keyframes flip-in { 0% { transform: perspective(500px) rotateX(-88deg); filter: brightness(.7); opacity: .55; } 60% { transform: perspective(500px) rotateX(8deg); } 100% { transform: perspective(500px) rotateX(0); filter: brightness(1); opacity: 1; } }
    @media (max-width: 360px) { .damage-selectors { grid-template-columns: 1fr; gap: 12px; } }
    @media (max-width: 340px) { .actions { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .flip { animation: none; } .result { transition: none; } }
    @media (max-width: 390px) { main { padding: 16px 12px 28px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <h1>Blue Max Damage Chit Draw</h1>
    <section class="panel">
      <label>Set di tessere
        <select id="setSelect">
          <option value="1984">Base 1984</option>
          <option value="2014" selected>Revised 2014</option>
        </select>
      </label>
      <div class="damage-selectors">
        <div class="damage-selector">
          <label class="damage-label" for="redCount">Red</label>
          <div class="damage-control">
            <input id="redCount" class="damage-value" type="number" min="0" max="36" step="1" placeholder="0" inputmode="numeric">
            <button class="step-button red" type="button" data-target="redCount" data-delta="1" aria-label="Aumenta tessere Red">+</button>
            <button class="step-button red" type="button" data-target="redCount" data-delta="-1" aria-label="Riduci tessere Red">−</button>
          </div>
        </div>
        <div class="damage-selector">
          <label class="damage-label" for="blueCount">Blue</label>
          <div class="damage-control">
            <input id="blueCount" class="damage-value" type="number" min="0" max="36" step="1" placeholder="0" inputmode="numeric">
            <button class="step-button blue" type="button" data-target="blueCount" data-delta="1" aria-label="Aumenta tessere Blue">+</button>
            <button class="step-button blue" type="button" data-target="blueCount" data-delta="-1" aria-label="Riduci tessere Blue">−</button>
          </div>
        </div>
      </div>
      <div class="actions">
        <button id="draw" class="draw-button" type="button">Estrai</button>
        <button id="reset" class="reset-button" type="button">Reset</button>
      </div>
      <div id="status" class="status"></div>
    </section>
    <h2>Estrazioni del turno</h2>
    <section id="results" class="groups"><div class="panel empty">Nessuna tessera estratta.</div></section>
  </main>
  <script>
    const sets = {
      '1984': { name: 'Base 1984', chits: [
        [1,'1 Engine','3 Engine'],[2,'1 Engine','3 Engine'],[3,'1 Engine','3 Engine'],[4,'1 Fuselage','3 Fuselage'],[5,'1 Fuselage','3 Fuselage'],[6,'1 Fuselage','3 Fuselage'],[7,'1 Left Wing','3 Left Wing'],[8,'1 Left Wing','3 Left Wing'],[9,'1 Left Wing','3 Left Wing'],[10,'1 Right Wing','3 Right Wing'],[11,'1 Right Wing','3 Right Wing'],[12,'1 Right Wing','3 Right Wing'],[13,'1 Tail','3 Tail'],[14,'1 Tail','3 Tail'],[15,'1 Tail','3 Tail'],[16,'2 Fuselage','4 Fuselage'],[17,'2 Fuselage','4 Fuselage'],[18,'2 Fuselage','4 Fuselage'],[19,'2 Left Wing','4 Left Wing'],[20,'2 Left Wing','4 Left Wing'],[21,'2 Left Wing','4 Left Wing'],[22,'2 Right Wing','4 Right Wing'],[23,'2 Right Wing','4 Right Wing'],[24,'2 Right Wing','4 Right Wing'],[25,'1 Engine','Engine Damaged'],[26,'1 Engine','Engine Damaged'],[27,'1 Fuselage','Fuel Tank Hit'],[28,'1 Fuselage','Fuel Tank Hit'],[29,'1 Tail','Rudder Jammed L'],[30,'1 Tail','Rudder Jammed R'],[31,'1 Fuselage','Pilot Grazed'],[32,'2 Fuselage','Gun Jammed'],[33,'2 Fuselage','Gun Jammed'],[34,'2 Fuselage','Observer Killed'],[35,'2 Fuselage','Pilot Killed'],[36,'2 Fuselage','EXPLODE!']
      ]},
      '2014': { name: 'Revised 2014', chits: [
        [1,'1 Engine','3 Engine'],[2,'1 Engine','3 Engine'],[3,'2 Engine','4 Engine'],[4,'2 Engine','4 Engine'],[5,'2 Engine','4 Engine'],[6,'1 Fuselage','5 Fuselage'],[7,'1 Fuselage','5 Fuselage'],[8,'2 Fuselage','6 Fuselage'],[9,'2 Fuselage','6 Fuselage'],[10,'3 Fuselage','7 Fuselage'],[11,'3 Fuselage','7 Fuselage'],[12,'4 Fuselage','8 Fuselage'],[13,'4 Fuselage','8 Fuselage'],[14,'1 Wing','5 Wing'],[15,'1 Wing','5 Wing'],[16,'2 Wing','6 Wing'],[17,'2 Wing','6 Wing'],[18,'3 Wing','7 Wing'],[19,'3 Wing','7 Wing'],[20,'4 Wing','8 Wing'],[21,'4 Wing','8 Wing'],[22,'1 Tail','3 Tail'],[23,'1 Tail','3 Tail'],[24,'2 Tail','4 Tail'],[25,'Engine Damaged: No Speed 3 Or 4 Maneuvers / 1 Fuselage / 2 Engine','Fuel Tank Hit: Lose 3 Fuel / 2 Fuselage'],[26,'Fabric Tears: No Speed 3 Or 4 Maneuvers / 3 Wing','Rudder Jams: Must Do Right Maneuvers For Next 3 Turns / 1 Tail'],[27,'Fabric Tears: No Restricted Maneuvers / 4 Wing','Rudder Jams: Must Do Left Maneuvers For Next 3 Turns / 1 Tail'],[28,'Struts Damaged: No Restricted Maneuvers / 1 Wing','Rudder Jams: Must Do Right Maneuvers For Next 2 Turns / 1 Tail'],[29,'1 Gun Destroyed / 3 Fuselage','Rudder Jams: Must Do Left Maneuvers For Next 2 Turns / 1 Tail'],[30,'Smoke','Fire'],[31,'Smoke','Fuel Tank Hit: Lose 6 Fuel / 3 Fuselage'],[32,'Observer Wounded: May Not Fire For 3 Turns / 3 Fuselage','Observer Killed / 4 Fuselage'],[33,'Observer Killed / 3 Fuselage','Observer Killed / 4 Fuselage'],[34,'Pilot Grazed: Must Do Slower Maneuver Next Turn / 1 Fuselage','Pilot Killed'],[35,'Pilot Grazed: Must Do Straight Maneuver Next Turn / 1 Fuselage','Fuel Tank Hit: EXPLODE!'],[36,'Pilot Killed','Pilot Killed']
      ]}
    };

    let selectedSet = '2014';
    let available = new Set(sets[selectedSet].chits.map(chit => chit[0]));
    let results = [];
    const $ = id => document.getElementById(id);

    function currentChits() { return sets[selectedSet].chits; }
    function drawRandom(array, count) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, count);
    }
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[character]));
    }
    function readCount(inputId) { return Math.max(0, Math.min(36, Number.parseInt($(inputId).value, 10) || 0)); }
    function setCount(inputId, value) { $(inputId).value = value <= 0 ? '' : String(Math.max(0, Math.min(36, value))); }
    function changeCount(inputId, delta) { setCount(inputId, readCount(inputId) + delta); }

    function card(result, index) {
      const label = result.side === 'blue' ? 'BLUE' : 'RED';
      const hiddenClass = result.revealed ? '' : 'hidden';
      const ariaLabel = result.revealed ? `Tessera ${result.id} ${label}` : `Scopri tessera ${label}`;
      return `<button class="result ${result.side} ${hiddenClass}" type="button" data-index="${index}" aria-label="${ariaLabel}"><span class="result-content"><span class="cover">TOCCA PER SCOPRIRE</span><span class="header-line"><span class="side">${label}</span><span class="id">Tessera ${result.id}</span></span><span class="value">${escapeHTML(result.value)}</span></span></button>`;
    }
    function showResults() {
      const container = $('results');
      if (!results.length) {
        container.innerHTML = '<div class="panel empty">Nessuna tessera estratta.</div>';
        return;
      }
      const red = results.map((result, index) => ({ result, index })).filter(item => item.result.side === 'red');
      const blue = results.map((result, index) => ({ result, index })).filter(item => item.result.side === 'blue');
      container.innerHTML = `${red.length ? `<div class="group"><h3 class="group-title">RED</h3>${red.map(item => card(item.result, item.index)).join('')}</div>` : ''}${blue.length ? `<div class="group"><h3 class="group-title">BLUE</h3>${blue.map(item => card(item.result, item.index)).join('')}</div>` : ''}`;
    }
    function message(text, warning = false) { $('status').innerHTML = warning ? `<div class="warning">${escapeHTML(text)}</div>` : escapeHTML(text); }
    function resetBag() {
      available = new Set(currentChits().map(chit => chit[0]));
      results = [];
      setCount('blueCount', 0);
      setCount('redCount', 0);
      showResults();
    }

    document.querySelectorAll('.step-button').forEach(button => {
      button.addEventListener('click', () => changeCount(button.dataset.target, Number(button.dataset.delta)));
    });
    ['redCount', 'blueCount'].forEach(inputId => {
      $(inputId).addEventListener('change', () => setCount(inputId, readCount(inputId)));
    });
    $('results').addEventListener('click', event => {
      const cardElement = event.target.closest('.result.hidden');
      if (!cardElement) return;
      const index = Number(cardElement.dataset.index);
      results[index].revealed = true;
      cardElement.classList.remove('hidden');
      cardElement.classList.add('flip');
      cardElement.setAttribute('aria-label', `Tessera ${results[index].id} ${results[index].side.toUpperCase()}`);
    });
    $('setSelect').addEventListener('change', () => {
      if (results.length && !window.confirm('Cambiare set cancella le estrazioni del turno. Continuare?')) {
        $('setSelect').value = selectedSet;
        return;
      }
      selectedSet = $('setSelect').value;
      resetBag();
      message('');
    });
    $('draw').addEventListener('click', () => {
      const blueCount = readCount('blueCount');
      const redCount = readCount('redCount');
      const total = blueCount + redCount;
      if (total === 0) return message('Inserisci almeno una tessera da estrarre.', true);
      if (total > 36) return message(`Non puoi estrarre ${total} tessere: il set contiene soltanto 36 tessere.`, true);
      if (total > available.size) return message(`Non puoi estrarre ${total} tessere: in questo turno ne restano soltanto ${available.size}. Reset per reimbussolare.`, true);
      const ids = drawRandom([...available], total);
      const chits = currentChits();
      const redIDs = ids.slice(0, redCount);
      const blueIDs = ids.slice(redCount);
      results.push(
        ...redIDs.map(id => ({ id, side: 'red', value: chits[id - 1][2], revealed: false })),
        ...blueIDs.map(id => ({ id, side: 'blue', value: chits[id - 1][1], revealed: false }))
      );
      ids.forEach(id => available.delete(id));
      message(`${total} tessere estratte dal set ${sets[selectedSet].name}. Tocca ciascuna tessera per scoprirla.`);
      showResults();
    });
    $('reset').addEventListener('click', () => {
      resetBag();
      message(`Tutte le 36 tessere del set ${sets[selectedSet].name} sono state reimbussolate.`);
    });
  </script>
</body>
</html>
